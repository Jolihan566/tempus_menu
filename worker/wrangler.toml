name = "tempus-cards"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
GH_OWNER = "Jolihan566"
GH_REPO = "tempus_menu"
GH_BASE = "main"
CARD_DIR = "player_cards"

# Per-IP limit: 5 submissions a minute. Delete this block if your account
# rejects it — the Worker runs fine without it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# The GitHub token is a secret, never put it in this file:
#   npx wrangler secret put GITHUB_TOKEN

# ---------------- Social (friends) ----------------
# Create the database once:  npx wrangler d1 create tempus-social
# then paste the database_id it prints below, and run:
#   npx wrangler d1 execute tempus-social --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "tempus-social"
database_id = "6c88843d-ae05-4417-918c-2e29ef76c2d7"

# Per-IP limit for Social: 120 calls a minute.
[[ratelimits]]
name = "SOCIAL_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60

# Optional staff key for resetting a player's Social link:
#   npx wrangler secret put ADMIN_KEY
